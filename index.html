<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lock Screen</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #ffffff;
        }

        .lock-card {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        input {
            padding: 12px;
            font-size: 20px;
            text-align: center;
            border: 2px solid #ddd;
            border-radius: 8px;
            margin-bottom: 20px;
            width: 180px;
            outline: none;
        }

        button {
            padding: 12px 40px;
            font-size: 18px;
            color: white;
            background-color: #3498db;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        button:active {
            background-color: #2980b9;
        }
    </style>
</head>
<body>

    <div class="lock-card">
        <input type="text" id="code-input" placeholder="DD/MM" autocomplete="off">
        <button onclick="checkCode()">Unlock</button>
    </div>

    <script>
        function checkCode() {
            const inputCode = document.getElementById('code-input').value.trim();
            const now = new Date();
            // Unlock Date: 26 December 2026 (00:00:00)
            const unlockDate = new Date(2026, 11, 26, 0, 0, 0); 

            if (inputCode === "26/12") {
                if (now >= unlockDate) {
                    // Redirects to main page upon successful verification
                    window.location.href = "index.html";
                } else {
                    alert("Sabar karein! Yeh surprise sirf 26/12/2026 ko hi khulega 🎁");
                }
            } else {
                alert("Galat code! Sahi code '26/12' hai.");
            }
        }
    </script>
</body>
</html>
